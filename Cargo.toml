[package]
name = "shuftlib"
version = "0.3.1"
edition = "2024"
authors = ["Sebastiano Giordano"]
categories = ["game-development"]
description = "A generic library for card games and related topics"
documentation = "https://docs.rs/shuftlib"
keywords = ["cards", "card_games"]
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/shuftle/shuftlib"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
bon = "3.9.1"
num-rational = "0.4.2"
rand="0.10"
strum = {version="0.28", default-features=false, features=["derive"]}
thiserror = "2.0"

[features]
default = []

[dev-dependencies]
proptest="1.11"

[profile.test.package.proptest]
opt-level = 3

[profile.test.package.rand_chacha]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]

unwrap_in_result = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
panic_in_result_fn = "warn"
float_cmp = "warn"
float_cmp_const = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
todo = "warn"
cast_lossless = "warn"
cognitive_complexity = "warn"
