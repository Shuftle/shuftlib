[package]
name = "shuftlib"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
authors = ["Sebastiano Giordano"]
categories = ["game-development"]
description = "A library for turn-based games: an engine for multiplayer servers, clients and bots, with Tressette"
documentation = "https://docs.rs/shuftlib"
keywords = ["game-engine", "turn-based", "card-games", "tressette", "multiplayer"]
license = "AGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/shuftle/shuftlib"

[lib]
path = "src/lib.rs"

[dependencies]
rand="0.10"
thiserror = "2.0"

[features]
default = []

[dev-dependencies]
proptest="1.12"

[profile.test.package.proptest]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]

unwrap_in_result = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
panic_in_result_fn = "warn"
float_cmp = "warn"
float_cmp_const = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
todo = "warn"
cast_lossless = "warn"
cognitive_complexity = "warn"
